<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ai-MI5 · 檔案總覽</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "Microsoft JhengHei", sans-serif; max-width: 720px;
         margin: 3rem auto; padding: 0 1.25rem; line-height: 1.7; }
  h1 { font-size: 1.5rem; }
  ul { list-style: none; padding: 0; }
  li { padding: .5rem 0; border-bottom: 1px solid rgba(128,128,128,.25); }
  a { text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { opacity: .6; }
</style>
</head>
<body>
<h1>Ai-MI5 · 檔案總覽</h1>
<ul id="list">
  <li class="empty">尚無檔案</li>
</ul>
<script>
fetch('./files.json')
  .then(r => r.ok ? r.json() : [])
  .then(files => {
    const ul = document.getElementById('list');
    if (!files.length) return;
    ul.innerHTML = files.map(f => `<li><a href="./${f}">${f}</a></li>`).join('');
  })
  .catch(() => {});
</script>
</body>
</html>
